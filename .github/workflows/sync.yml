name: Sync official FRP images

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync.yml'
      - 'scripts/**'

permissions: {}

concurrency:
  group: official-frp-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.sync.outputs.version }}
      frpc: ${{ steps.sync.outputs.frpc }}
      frps: ${{ steps.sync.outputs.frps }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned regctl
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/regclient/regclient/releases/download/v0.11.7/regctl-linux-amd64 \
            -o "$RUNNER_TEMP/regctl"
          echo '3737fbbdd791e04e7a831640b681f3397a376498e80e2ad9b1b2d27296f239bc  '"$RUNNER_TEMP/regctl" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/regctl"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Test promotion guards
        run: bash tests/sync.test.sh
      - name: Copy, verify, and promote both images
        id: sync
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REGCTL_CONFIG: ${{ runner.temp }}/regctl-config.json
          DOCKER_CONFIG: ${{ runner.temp }}/docker-auth
          EVIDENCE_DIR: ${{ runner.temp }}/evidence
        run: |
          set -euo pipefail
          trap 'rm -f "$REGCTL_CONFIG"; rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GH_TOKEN" | regctl registry login ghcr.io --user "$GITHUB_ACTOR" --pass-stdin
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          bash scripts/sync.sh
      - name: Save digest evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: digest-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: ignore
          retention-days: 90

  verify-public:
    needs: sync
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Pull and run both latest images anonymously
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ needs.sync.outputs.version }}
          FRPC_DIGEST: ${{ needs.sync.outputs.frpc }}
          FRPS_DIGEST: ${{ needs.sync.outputs.frps }}
          DOCKER_CONFIG: ${{ runner.temp }}/anonymous-docker
        run: |
          set -euo pipefail
          mkdir -p "$DOCKER_CONFIG"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          for component in frpc frps; do
            image="ghcr.io/${OWNER,,}/$component"
            key="${component^^}_DIGEST"
            expected=${!key}
            for tag in "$VERSION" latest; do
              docker pull "$image:$tag"
              docker image inspect "$image:$tag" --format '{{json .RepoDigests}}' | jq -e --arg ref "$image@$expected" 'index($ref) != null'
            done
            actual=$(docker run --rm --network none --read-only --cap-drop ALL \
              --security-opt no-new-privileges "$image@$expected" --version)
            test "$actual" = "${VERSION#v}"
            echo "Anonymous pull and version verified: $image:$VERSION / latest ($expected)"
          done
