name: Sync official FRP images

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync.yml'
      - 'scripts/**'

permissions: {}

concurrency:
  group: official-frp-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned regctl
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/regclient/regclient/releases/download/v0.11.7/regctl-linux-amd64 \
            -o "$RUNNER_TEMP/regctl"
          echo '3737fbbdd791e04e7a831640b681f3397a376498e80e2ad9b1b2d27296f239bc  '"$RUNNER_TEMP/regctl" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/regctl"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Copy official images and reconcile tags
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || github.repository_owner }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || github.repository_owner }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          REGCTL_CONFIG: ${{ runner.temp }}/regctl-config.json
          EVIDENCE_DIR: ${{ runner.temp }}/evidence
        run: |
          set -euo pipefail
          test -n "$DOCKERHUB_TOKEN" || { echo 'Configure the DOCKERHUB_TOKEN repository secret before publishing'; exit 1; }
          export DOCKERHUB_USERNAME="${DOCKERHUB_USERNAME,,}"
          trap 'rm -f "$REGCTL_CONFIG"' EXIT
          printf '%s' "$GH_TOKEN" | regctl registry login ghcr.io --user "$GITHUB_ACTOR" --pass-stdin
          printf '%s' "$DOCKERHUB_TOKEN" | regctl registry login docker.io --user "$DOCKERHUB_USERNAME" --pass-stdin
          python3 scripts/sync.py
      - name: Save digest evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: digest-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: ignore
          retention-days: 90
